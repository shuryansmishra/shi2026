# Render.com Service Configuration
# https://render.com/docs/yaml-spec
#
# ARCHITECTURE:
#   Frontend → Vercel (shi2026.vercel.app) — static site, mock mode fallback
#   Backend  → Render (this file) — FastAPI + real PyTorch ML inference
#
# SETUP:
#   1. render.com → New → Blueprint → connect GitHub repo shuryansmishra/shi2026
#   2. Wait ~10 min for build (torch takes a while to install)
#   3. Copy your Render URL: https://satquery-backend.onrender.com
#   4. Vercel dashboard → shi2026 project → Settings → Environment Variables:
#         VITE_BACKEND_URL = https://satquery-backend.onrender.com
#   5. Vercel → Deployments → Redeploy

services:
  - type: web
    name: satquery-backend
    runtime: python
    region: singapore        # Closest to India for low latency

    # -----------------------------------------------------------------------
    # PLAN: FREE ($0) — 100% Free, No Credit Card Required, 512 MB RAM
    # -----------------------------------------------------------------------
    plan: free
    buildCommand: pip install -r requirements-render.txt

    rootDir: backend
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VQA_MOCK_MODE
        value: "true"
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
      # Add these in Render dashboard (keep secrets out of git):
      # - key: ANTHROPIC_API_KEY
      #   sync: false         # prompts for value in dashboard
